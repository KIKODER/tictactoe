<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>TicksN'Tacks</title>
</head>
<body>
    <main>
        <section id="start-screen">
            <div class="title"><span class="theme-one">Ticks</span><span class="theme-two">N'</span><span class="theme-one">Tacks</span></div>
        </section>

        <section id="form-screen">
            <form id="setup-form">
                <label for="p1name">Player 1:</label>
                <input type="text" id="p1name" name="p1name">
                <label for="p2name">Player 2:</label>
                <input type="text" id="p2name" name="p2name">
                <div>
                    <label for="p1mark">Player 1's mark:</label>
                        <select id="p1mark" name="p1mark">
                            <option value=""></option>
                            <option value="X">X</option>
                            <option value="O">O</option>
                        </select>
                </div>
                <p id="form-error" class="error-message"></p>
                <button class="button-start">start</button>
            </form>
        </section>

        <section id="play-screen" class="hidden">
            <div id="status-display" class="status-display"></div>
            <div id="playgrid" class="playgrid">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <div id="button-container">
                <button id="button-reset">reset</button>
                <button id="button-quit">quit</button>
            </div>
        </section>

    </main>
    <script src="script.js"></script>
</body>
</html>
