<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>TicTacToe</title>
</head>
<body>
    <main>
        <section id="start-screen">
            <div class="title">Tic Tac Toe</div>
        </section>

        <section id="form-screen">
            <form>
                <label for="p1name">Player 1:</label>
                <input type="text" id="p1name" name="p1name">
                <label for="p2name">Player 2:</label>
                <input type="text" id="p2name" name="p2name">
                <label for="p1mark">Player 1's mark:</label>
                <select id="p1mark" name="p1mark">
                    <option value="">Choose a mark:</option>
                    <option value="X">X</option>
                    <option value="O">O</option>
                </select>
                <button class="button-start">start</button>
            </form>
        </section>

        <section id="play-screen" class="hidden">
            <div class="playgrid">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
        </section>

    </main>
    <script src="script.js"></script>
</body>
</html>
